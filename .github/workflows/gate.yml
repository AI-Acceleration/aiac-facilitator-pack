name: gate
on:
  # pull_request_target, not pull_request: GitHub runs THIS file as it is on
  # main, never a pull request's copy of it, so a pull request cannot edit or
  # delete the check that judges it. That trust is only safe because nothing
  # from the pull request is executed here: its commits are fetched as git
  # objects and read by main's scanner. Never check out the pull request's
  # head into the workspace, run its scripts or tests, or add secrets here.
  # The pull request's own tests run in tests.yml, unprivileged.
  # Only pull requests into main: on pull_request_target the "trusted" code
  # is the tip of the BASE branch, and only main is protected. A pull request
  # into any other branch would be judged by that branch's copy of the gate.
  pull_request_target:
    branches: [main]
  push:
    branches: [main]

# The gate only reads the repository. No step needs to write anything.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Pinned by full commit SHA: a moved tag cannot change what runs here.
      # ref is github.sha: on pull_request_target the tip of main (the base),
      # on push the pushed commit on main. Both are trusted code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0              # --history needs the full object store
          persist-credentials: false  # no token left in .git/config

      # Objects only: fetched into a private ref, never checked out.
      - name: Fetch the pull request as data
        if: ${{ github.event_name == 'pull_request_target' }}
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in ''|*[!0-9]*) echo "GATE ERROR: bad pull request number."; exit 3 ;; esac
          case "$PR_HEAD" in *[!0-9a-f]*) echo "GATE ERROR: bad head commit."; exit 3 ;; esac
          if [ "${#PR_HEAD}" -ne 40 ]; then echo "GATE ERROR: bad head commit."; exit 3; fi
          git fetch --no-tags --quiet origin "+refs/pull/${PR_NUMBER}/head:refs/gate/pr-tip"
          if ! git rev-parse --verify --quiet "${PR_HEAD}^{commit}" >/dev/null; then
            echo "GATE ERROR: the head commit this run was started for is gone"
            echo "(force-pushed?). The run for the new head covers the pull request."
            exit 3
          fi
          git update-ref refs/gate/pr-head "$PR_HEAD"
          git update-ref -d refs/gate/pr-tip

      # bin/gate_pr_check.sh and bin/gate_scan.py come from main's checkout.
      - name: Private-data gate (pull request, judged by main's gate)
        if: ${{ github.event_name == 'pull_request_target' }}
        shell: bash
        env:
          BASE: ${{ github.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash bin/gate_pr_check.sh "$BASE" "$PR_HEAD"

      - name: Private-data gate (main, tracked files)
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: python3 bin/gate_scan.py --tree --ci

      - name: Private-data gate (main, full history)
        if: ${{ !cancelled() && github.event_name == 'push' }}
        shell: bash
        run: python3 bin/gate_scan.py --history --ci

      - name: Assert the withheld files are absent (main)
        if: ${{ !cancelled() && github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          # Belt and braces for gate_scan.py's own path check. Prints only the
          # pattern (from the pattern list), never a matched file name.
          # Case-INSENSITIVE (-ipath / -iname) on purpose: the runner is
          # case-sensitive ext4, but most contributors clone onto
          # case-insensitive APFS/NTFS, where a case-variant of a withheld
          # filename is the same file.
          fail=0
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            case "$p" in \#*) continue ;; esac
            if find . -ipath "./$p" -print -quit | grep -q .; then
              echo "FORBIDDEN PATH PRESENT: $p"; fail=1
            fi
          done < .githooks/forbidden-paths.txt
          while IFS= read -r b; do
            [ -z "$b" ] && continue
            case "$b" in \#*) continue ;; esac
            if find . -iname "$b" -print -quit | grep -q .; then
              echo "FORBIDDEN BASENAME PRESENT: $b"; fail=1
            fi
          done < .githooks/forbidden-basenames.txt
          exit $fail
